[package]
name = "textual-gtk"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_5"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
md-5 = "0.11.0"
plist = "1.10.3"
serde_json = "1.0.154"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
webkit6 = { version = "0.6", features = ["v2_52"] }

[dev-dependencies]
yaml-rust2 = "0.13.0"
